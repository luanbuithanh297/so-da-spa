<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sổ Da Spa">
<meta name="theme-color" content="#FFE4EC">
<title>Sổ Da Spa</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#FFF1F6;--ink:#4A2A38;--muted:#86687A;--pink:#EC8FAD;--pink-deep:#B8456F;--lav:#8B6FD6;--line:#F6E0E8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overscroll-behavior:none}
body{padding-top:env(safe-area-inset-top);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:400;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#app{position:fixed;left:0;right:0;bottom:0;top:env(safe-area-inset-top);width:100%;height:calc(100% - env(safe-area-inset-top));border:0;background:var(--bg);display:block}
#splash{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:linear-gradient(160deg,#FFE4EC 0%,#F6EEFF 100%);transition:opacity .35s ease}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:112px;height:112px;border-radius:26px;box-shadow:0 10px 28px rgba(184,69,111,.18)}
#splash h1{margin:0;font-size:22px;font-weight:500;color:var(--pink-deep)}
#splash p{margin:0;font-size:15px;color:var(--muted);max-width:300px;line-height:1.5}
.dots{display:flex;gap:7px;height:10px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--lav);opacity:.35;animation:dot 1.1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
#offline{display:none;flex-direction:column;align-items:center;gap:12px}
#offline button{min-height:48px;padding:0 26px;border-radius:14px;border:0;font:inherit;font-weight:500;font-size:16px;color:#fff;background:linear-gradient(135deg,#E8789D,#B8456F);box-shadow:0 6px 16px rgba(184,69,111,.22)}
#splash.off .dots{display:none}
#splash.off #offline{display:flex}
#splash.off #msg{display:none}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}#splash{transition:none}}
</style>
</head>
<body>
<iframe id="app" title="Sổ Da Spa" allow="microphone; clipboard-write"></iframe>

<div id="splash" role="status" aria-live="polite">
  <img src="icon-192.png" alt="" width="112" height="112">
  <h1>Sổ Da Spa</h1>
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  <p id="msg">Đang mở app…</p>
  <div id="offline">
    <p id="offmsg">Không có kết nối mạng</p>
    <button id="retry" type="button">Thử lại</button>
  </div>
</div>
<noscript><p style="padding:24px;text-align:center">Cần bật JavaScript để dùng Sổ Da Spa.</p></noscript>

<script src="config.js"></script>
<script src="vo.js"></script>
<script>
(function () {
  var frame = document.getElementById('app'), splash = document.getElementById('splash');
  var msg = document.getElementById('msg'), offmsg = document.getElementById('offmsg');
  var url = (window.SO_DA_SPA && window.SO_DA_SPA.webAppUrl) || '';
  var loaded = false, timer = null;

  function showOffline(text) {
    loaded = false;
    clearTimeout(timer);
    offmsg.textContent = text || 'Không có kết nối mạng';
    splash.classList.remove('gone');
    splash.classList.add('off');
  }
  function hideSplash() {
    loaded = true;
    clearTimeout(timer);
    splash.classList.remove('off');
    splash.classList.add('gone');
  }
  function load() {
    if (!url) { msg.textContent = 'Chưa cài địa chỉ app. Hãy chạy lại CAP_NHAT.bat để tạo lại vỏ app.'; return; }
    if (navigator.onLine === false) { showOffline(); return; }
    loaded = false;
    splash.classList.remove('gone', 'off');
    msg.textContent = 'Đang mở app…';
    frame.src = url;
    clearTimeout(timer);
    timer = setTimeout(function () { if (!loaded) showOffline('Chưa mở được app. Kiểm tra mạng rồi thử lại.'); }, 40000);
  }
  frame.addEventListener('load', function () {
    if (!frame.getAttribute('src')) return;
    if (navigator.onLine === false) showOffline(); else hideSplash();
  });
  document.getElementById('retry').addEventListener('click', function () {
    frame.removeAttribute('src');
    load();
  });
  window.addEventListener('online', function () { if (splash.classList.contains('off')) load(); });
  window.addEventListener('offline', function () { if (!loaded) showOffline(); });
  load();
})();
</script>
</body>
</html>
